name: reel_saver_mobile
description: Flutter mobile app for Reel-Saver — share Instagram Reels or MP4/MP3 files, transcribe for free, summarize, and organize in editable categories.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  receive_sharing_intent: ^1.8.1
  file_picker: ^8.1.4
  speech_to_text: ^7.0.0
  audioplayers: ^6.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
